name: Construir APK
on: { push: { branches: [main] }, workflow_dispatch: {}, schedule: [{ cron: "0 6 1 * *" }] }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle -p android assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk MiTV-Deportes.apk
      - uses: actions/upload-artifact@v4
        with: { name: MiTV-Deportes-apk, path: MiTV-Deportes.apk }
      - uses: softprops/action-gh-release@v2
        with: { tag_name: apk-latest, name: "Mi TV Deportes (última versión)", files: MiTV-Deportes.apk, make_latest: true }
